<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function power(a, b) {
            return a*b;
        }
        console.log("10 cube is "+ power(10,3));

        //JS function - class 1 entity
        // functions can be stored as a avriable
        // anonymous function
        const pow = function(a,b) {
            return a**b;
        };
        console.log(typeof pow); //function
        console.log("10 cube is " + pow(10,3));
        // arrow function /lambda 
        //(a,b) => a**b
        //(parameters) => return_valure;
        const p =(a,b) => a**b;
        console.log("10 cube is " + p  (10,3));
        
        
        
        
    </script>
</body>
</html>
