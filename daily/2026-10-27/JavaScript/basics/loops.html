<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>loops in javascript</h1>
   <script>
    // for loop - print 1 to 5
    for (let i = 1; i <= 5; i++) {
        console.log(i);
    }

    // while loop - table of 5
    let n = 1;
    while (n <= 10) {
        console.log("5 x " + n + " = " + (5 * n));
        n++;
    }

    // do while - runs at least once
    let k = 10;
    do {
        console.log("k is " + k);
        k++;
    } while (k < 5);

    // break and continue
    for (let i = 1; i <= 10; i++) {
        if (i == 3) continue; // skip 3
        if (i == 8) break;    // stop at 8
        console.log(i);
    }

    // for of - values of an array
    let fruits = ["apple", "mango", "banana"];
    for (let fruit of fruits) {
        console.log(fruit);
    }

    // for in - keys of an object
    let stu = {
        "id": 101,
        "name": "viny",
        "age": 20
    };
    for (let key in stu) {
        console.log(key + " : " + stu[key]);
    }

    // sum of first 10 numbers
    let sum = 0;
    for (let i = 1; i <= 10; i++) {
        sum += i;
    }
    console.log("sum = " + sum); // 55
   </script>
</body>
</html>
