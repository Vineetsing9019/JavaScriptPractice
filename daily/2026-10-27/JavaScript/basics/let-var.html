<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>var vs let vs const</h1>
   <script>
    // 1. scope: var is function scoped, let and const are block scoped
    if (true) {
        var x = 1;
        let y = 2;
        const z = 3;
    }
    console.log(x); // 1
    // console.log(y); // ReferenceError: y is not defined
    // console.log(z); // ReferenceError: z is not defined

    // 2. re-declare: var allows it, let and const don't
    var city = "pune";
    var city = "mumbai";
    console.log(city); // mumbai
    let state = "MH";
    // let state = "GJ"; // SyntaxError: already declared

    // 3. re-assign: var and let allow it, const doesn't
    let count = 1;
    count = 2;
    console.log(count);
    const PI = 3.14;
    // PI = 3; // TypeError: Assignment to constant variable

    // const object: the object can change, the variable can't point elsewhere
    const stu = { name: "viny", age: 20 };
    stu.age = 21;
    console.log(stu.age); // 21

    // 4. loops: let gives each round its own copy
    for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log("var i = " + i), 0); // 3 3 3
    }
    for (let j = 0; j < 3; j++) {
        setTimeout(() => console.log("let j = " + j), 0); // 0 1 2
    }

    // rule: use const by default, let when the value changes, avoid var
   </script>
</body>
</html>
