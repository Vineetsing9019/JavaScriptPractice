<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>operators in javascript</h1>
   <script>
    var a = 10;
    var b = 3;

    // arithmetic operators
    console.log(a + b);  // 13
    console.log(a - b);  // 7
    console.log(a * b);  // 30
    console.log(a / b);  // 3.333...
    console.log(a % b);  // 1
    console.log(a ** b); // 1000 (ES6 - power)

    // increment / decrement
    let count = 5;
    count++;
    console.log(count); // 6
    count--;
    console.log(count); // 5

    // assignment operators
    let x = 20;
    x += 5;  // x = x + 5
    console.log(x); // 25
    x *= 2;
    console.log(x); // 50

    // comparison operators
    console.log(10 == "10");  // true  (checks only value)
    console.log(10 === "10"); // false (checks value and type)
    console.log(10 != "10");  // false
    console.log(10 !== "10"); // true
    console.log(a > b);       // true

    // logical operators
    let age = 20;
    console.log(age > 18 && age < 60); // true
    console.log(age < 18 || age > 60); // false
    console.log(!(age > 18));          // false

    // ternary operator
    let result = age >= 18 ? "adult" : "minor";
    console.log(result);

    // + with string joins (concatenation)
    console.log("10" + 5); // 105
    console.log("10" - 5); // 5
   </script>
</body>
</html>
